<div class="container">
  <h2>Experiências</h2>

  <mat-accordion class="example-headers-align" multi>
    @for(item of experiencias(); track item) {
    <mat-expansion-panel>
      <mat-expansion-panel-header>
        <mat-panel-title>
          {{item.titulo}}
        </mat-panel-title>
        <mat-panel-description>
          {{item.descricao}}
        </mat-panel-description>
      </mat-expansion-panel-header>
      <p>{{item.texto}}</p>
    </mat-expansion-panel>
    }

  </mat-accordion>
</div>
